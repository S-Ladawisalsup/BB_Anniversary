<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gasha Box</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Advertisement Popup -->
  <div id="adModal" class="modal">

    <div class="modal-content">

      <button id="closeBtn" class="close-btn">
        ✕
      </button>

      <img
        src="images/anniversary.png"
        alt="Happy Anniversary"
        class="ad-image"
      >

    </div>

  </div>

  <h1 id="mainTitle">
    Happy Anniversary ❤️
  </h1>

  <h3>
    เลือกกล่องของขวัญ 🎁
  </h3>
  
  <div id="boxContainer" class="box-grid">
  
  </div>
  
  <p id="statusText">
    เหลือสิทธิ์เปิดอีก 1 ครั้ง
  </p>

  <div id="rewardModal" class="modal hidden">

  <div class="modal-content">

    <button id="rewardCloseBtn" class="close-btn">
      ✕
    </button>

    <img id="rewardImage" class="ad-image">

    <h2 id="rewardTitle"></h2>

    <p id="rewardDesc"></p>

  </div>

</div>

  <script src="app.js"></script>

</body>
</html>
