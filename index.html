<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Welcome Popup -->
  <div id="welcomeModal" class="modal">

    <div class="modal-content welcome-content">

      <button
        id="closeWelcomeBtn"
        class="close-btn">
        ✕
      </button>

      <img
        src="images/anniversary.png"
        class="welcome-image"
        alt="Happy Anniversary">

    </div>

  </div>

  <!-- Main Content -->
  <main>

    <h1 class="page-title">
      Happy Anniversary ❤️
    </h1>

    <p class="subtitle">
      Anniversary Lucky Box 🎀
    </p>

    <p id="remainingText"></p>

    <div
      id="boxContainer"
      class="box-grid">
    </div>

  </main>

  <!-- Reward Modal -->
  <div
    id="rewardModal"
    class="modal hidden">

    <div
      class="modal-content reward-content">

      <button
        id="closeRewardBtn"
        class="close-btn">
        ✕
      </button>

      <img
        id="rewardImage"
        class="reward-image"
        alt="Reward">

      <h2 id="rewardTitle"></h2>

      <p id="rewardDesc"></p>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
